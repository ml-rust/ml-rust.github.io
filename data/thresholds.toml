# Tier thresholds. Every number a tier rule compares a signal against.
#
# `catalogue calibrate` measured the marked values at p90 of their population.
# `calibrated` is the date of the crates.io dump it read. Unmarked values keep
# their pre-calibration research numbers. Values stay frozen until the yearly
# recalibration. Any change to the file raises `version`.
# Rule text: crates/catalogue-core/src/tier/.

version = 6
calibrated = 2026-11-03

[new]
max_age_days = 180

[library_featured]
# Calibrated: p90 over discovery candidates with at least 1 active user.
min_active_users = 11.0
# Calibrated: p90 over the same population.
min_new_adopters = 9.0
# Not calibrated: every candidate measured 1.0, so the lib.rs cutoff stays.
min_former_glory = 0.5

[app_featured]
min_signals = 2
# Calibrated: p90 of latest-3-release binary downloads over GitHub leads.
binary_downloads = 884
# Not calibrated: the three values below keep research numbers.
homebrew_on_request_365d = 500
repology_families = 2
docker_pull_growth_90d = 10000

[dormancy]
min_days = 365
dead_rot_signals = 2
dead_consecutive_checks = 2

[interval]
patch_gt3_major_ge1 = 700
patch_gt3 = 450
patch_gt0 = 300
major_ge1 = 200
minor_gt3 = 140
other = 80
days_per_release_cap = 50
downloads_per_month_double = 50000
active_users_double = 10.0

[rot]
unanswered_days = 270
maintainer_silence_days = 365
advisory_grace_days = 60
lost_glory_below = 0.5
# Not calibrated: the sandbox check runs weekly, so 45 days allows missed runs.
build_check_max_age_days = 45

[finished]
min_former_glory = 0.8
min_new_adopters = 1.0
min_binary_downloads_per_release = 200

[fallback]
# Not calibrated: two weeks of daily runs. A source down longer reads as unknown.
max_age_days = 14

# Not calibrated. Movement labels a list row and never affects a tier.
[movement]
window_days = 30
min_share = 0.25
min_users = 5.0
