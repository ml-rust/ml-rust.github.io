# Catalogue topics.
#
# Each topic is a job a developer wants done, named in their words. `parent` nests a topic under another.
# A topic `summary` is a published claim: it needs evidence links.
# `categories.toml` holds the second way in: what a project is, not the job it does.
#
# `catalogue seed` maps a drafted entry to topics in two steps. A human reviews every drafted entry.
#
# 1. `keywords` and `categories` match the crates.io keywords and category slugs of every family crate.
# 2. When step 1 finds no topic, `terms` match the name and description of the primary crate.
#    A term is whole lowercase words, separated by one space. `t sne` matches `t-SNE`.
#
# Discovery reads these `keywords`, `categories` and `terms` too, so a match here also makes a crate a candidate.
#
# A lead bypasses the discovery rules, so these two steps alone remove non-ML repos.
# Its step 2 also reads the repository name, description and GitHub topics.
#
# A term must name the job or a format. It never names one crate. It can name an upstream engine
# that bindings and ports name in their descriptions: `whisper cpp`, `xgboost`. A word with a second common
# meaning stays out: `inference` also means type inference, `embedding` also means embedding a
# language, `audio` also covers plain file readers.
#
# Generic markers such as the `machine-learning` and `ml` keywords and the
# `science::ml` category map to no topic: nearly every candidate carries them,
# so they say nothing about the job. A term never holds `machine learning` or `ai` alone. A longer phrase can, when it names the job.

[[topic]]
id = "run-models"
name = "Run and serve models"
keywords = ["inference", "onnx", "onnxruntime", "gguf", "llama", "llama-cpp", "model-serving", "stable-diffusion", "transformer", "transformers"]
terms = ["onnx", "stable diffusion", "gguf", "llama cpp", "model serving", "model inference", "machine learning inference", "tensorflow lite", "tflite"]

