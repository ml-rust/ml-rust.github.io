# Catalogue categories.
#
# A category says what a project is, for a person who wants a ready thing: "I want a vector database".
# A topic in `topics.toml` says the job: "I want to run models". An entry has at most one category.
# A `blurb` is one plain sentence that defines the category. It holds no claim that needs evidence.
#
# `catalogue seed` and `catalogue seed --leads` set `category` in two steps. The order is the reverse
# of the topic steps: a description says what a project is, and keywords also list what it touches.
# A human reviews every drafted entry.
#
# 1. `terms` match the same texts as the terms of a topic.
# 2. When step 1 finds no category, `keywords` and `categories` match the crates.io keywords and
#    category slugs of every family crate.
#
# When several categories match in one step, the first in this file wins. So order matters, and an
# earlier category holds only words that a later category cannot use. Specific domains come first
# and the general ones come last.
#
# The bare keywords `tensor` and `tensors` stay out of Tensors and math. A model format also stores
# tensors, and a framework carries the keyword `tensor`. ML frameworks owns `deep-learning`, because
# every domain category that could claim a deep learning app comes before it.
#
# No match leaves `category` unset and never skips the draft. An install channel changes nothing.
#
# The term rules of `topics.toml` apply: whole lowercase words, separated by one space. A term names
# what the project is or a format. It never names one crate. A word with a second common meaning
# stays out: `inference` also means type inference. The `machine-learning` and `ml` keywords, the
# `science::ml` category, and `machine learning` or `ai` alone map to no category.
# A term maps to one category.

[[category]]
id = "speech-audio"
name = "Speech and audio"
blurb = "Libraries and programs that recognize speech, synthesize it, detect voice or clean up audio."
keywords = ["speech", "speech-recognition", "speech-to-text", "text-to-speech", "speech-synthesis", "asr", "tts", "whisper", "audio-ml", "vad", "voice-activity-detection", "audio-denoising"]
terms = ["speech recognition", "automatic speech recognition", "speech synthesis", "speech to text", "text to speech", "speech enhancement", "speaker diarization", "voice activity", "audio denoising", "transcription", "speech"]

