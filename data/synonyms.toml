# Search synonyms.
#
# Each group lists terms that mean the same thing. When an entry's name,
# topics or description holds one term of a group, the search index adds the
# other terms of that group to the entry, so a query for any of them finds it.
#
# A group holds only true synonyms and abbreviations. A human reviews every group.
# Terms are lowercase and trimmed. A group has at least two terms.
# No term appears in two groups.

[[group]]
terms = ["ml", "machine learning"]

[[group]]
terms = ["llm", "large language model"]

