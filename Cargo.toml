[workspace]
members = ["crates/catalogue-core", "crates/catalogue-signals", "crates/catalogue"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/ml-rust.github.io"

[workspace.dependencies]
# Derive-based (de)serialization for every data file type.
serde = { version = "1", features = ["derive"] }
# Parses the TOML data files and writes native TOML dates.
toml = "1"
# Typed error enums in the core and the CLI library.
thiserror = "2"
# Calendar dates (`added`, `date`, `since`) and the UTC timestamps in the dump.
jiff = "0.2"
# Parsed and normalised repository, homepage, issue and evidence links.
url = { version = "2", features = ["serde"] }
# Argument parsing for the `catalogue` command.
clap = { version = "4", features = ["derive"] }
# Gzip decoding of the crates.io database dump, and encoding in its tests.
# The zlib-rs backend inflates the dump in fewer instructions than miniz_oxide.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Streams the entries of the crates.io database dump archive.
tar = "0.4"
# Reads the psql CSV tables inside the crates.io database dump.
csv = "1"
# Parses `metadata.json` in the crates.io database dump.
serde_json = "1"
# Fast hashing for maps keyed by crates.io integer ids.
rustc-hash = "2"
# Blocking HTTPS client with rustls for the crates.io database dump download.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# Temporary directories for the download tests, created under the build directory.
tempfile = "3"
# Pure data model and validation, shared by the CLI.
catalogue-core = { path = "crates/catalogue-core" }
# Raw signals from the crates.io database dump, used by the dump commands.
catalogue-signals = { path = "crates/catalogue-signals" }
