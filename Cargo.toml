[workspace]
members = ["crates/catalogue-core", "crates/catalogue"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/ml-rust.github.io"

[workspace.dependencies]
# Derive-based (de)serialization for every data file type.
serde = { version = "1", features = ["derive"] }
# Parses the TOML data files and writes native TOML dates.
toml = "1"
# Typed error enums in the core and the CLI library.
thiserror = "2"
# Calendar dates (`added`, `date`, `since`) without a time zone.
jiff = "0.2"
# Parsed and normalised repository, homepage, issue and evidence links.
url = { version = "2", features = ["serde"] }
# Argument parsing for the `catalogue` command.
clap = { version = "4", features = ["derive"] }
# Pure data model and validation, shared by the CLI.
catalogue-core = { path = "crates/catalogue-core" }
