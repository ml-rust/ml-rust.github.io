<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · {{ layout.site_name }}</title>
<link rel="stylesheet" href="{{ layout.css }}">
<link rel="alternate" type="application/atom+xml" title="Tier changes and new entries" href="/changes/feed.xml">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
<a class="site-name" href="/">{{ layout.site_name }}</a>
<form class="site-search" action="/search/" method="get" role="search">
<label for="site-search-q">Search the catalogue</label>
<input id="site-search-q" name="q" type="search">
<button type="submit">Search</button>
</form>
<nav class="site-nav" aria-label="Main">
<ul>
{%- for link in layout.nav %}
<li><a href="{{ link.href }}"{% if link.current %} aria-current="page"{% endif %}>{{ link.label }}</a></li>
{%- endfor %}
</ul>
</nav>
</header>
<main id="main" tabindex="-1">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
<p>Data: <a href="https://github.com/ml-rust/ml-rust.github.io/blob/main/data/LICENSE">CC-BY-4.0</a>. Code: <a href="https://github.com/ml-rust/ml-rust.github.io/blob/main/LICENSE">Apache-2.0</a>. Source: <a href="https://github.com/ml-rust/ml-rust.github.io">ml-rust/ml-rust.github.io</a>.</p>
</footer>
</body>
</html>
