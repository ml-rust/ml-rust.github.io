<aside class="project-action{% if action.archived %} project-action-quiet{% endif %}" aria-labelledby="project-links-title">
<h2 id="project-links-title">{% if action.archived %}For existing users{% else %}Links{% endif %}</h2>
<ul class="link-list">
{%- for link in action.links %}
<li><a class="link-row" href="{{ link.href }}"><span class="link-label">{{ link.label }}</span><span class="link-target">{{ link.text }}</span></a></li>
{%- endfor %}
</ul>
{%- if let Some(command) = action.install.command %}
<p class="install-label">Install</p>
<p class="install-line"><code data-install-command="{{ command }}">{{ command }}</code></p>
{%- endif %}
</aside>
