[package]
name = "catalogue-github"
version.workspace = true
description = "GitHub App client of the ml-rust catalogue bot: App auth, installation tokens, issues, comments and labels"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# `ScriptedTransport` and `NoWait` for tests in this crate and in the CLI.
testing = []

[dependencies]
catalogue-core.workspace = true
catalogue-signals.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
catalogue-github = { path = ".", features = ["testing"] }
tempfile.workspace = true
