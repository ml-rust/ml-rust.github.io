# cargo-deny config.
#
# Run locally: `cargo deny --exclude-dev check`
# Search module, on its only target:
#   `cargo deny --exclude-dev --manifest-path crates/catalogue-search-wasm/Cargo.toml --target wasm32-unknown-unknown check`
# CI gate:     .github/workflows/test.yml :: audit job
#
# Dev-dependencies are excluded in CI. They link tests only, and a
# finding in a crate no consumer links is not a release gate.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]

# ────────────────────────────────────────────────────────────────────────
# Security advisories. Any RustSec advisory against a dependency, direct or
# transitive, fails CI. A yanked version fails too.
[advisories]
version = 2
yanked = "deny"
ignore = []

# ────────────────────────────────────────────────────────────────────────
# Licences: an allow-list. A transitive bump cannot add a stronger
# obligation for a consumer without an edit here.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
# The HTML parser behind the README renderer needs these, unmodified. MPL-2.0 covers changes to
# their own files only, so it is allowed per crate and nowhere else.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
]

# ────────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
# catalogue names catalogue-core by path.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip-tree = []

# ────────────────────────────────────────────────────────────────────────
# crates.io only. A git dependency is one no advisory or yank reaches.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
