# Pages: score the catalogue, record the day's snapshot, deploy the site.
#
# Until `oxidoc-search` is on crates.io the committed Cargo.lock cannot resolve
# it, so every job here that uses `--locked` fails. The first working run follows
# the oxidoc release. This workflow never checks out oxidoc to work around that.
#
# Jobs:
#   signals — runs `catalogue tiers`, uploads the report, and pushes the snapshot
#             to the orphan `signals` branch
#   build   — builds the site from the report and the history, adds the search
#             wasm files, and uploads the Pages artifact
#   deploy  — publishes that artifact
#
# No job restores a cache. `sandbox-check.yml` runs third-party build scripts on
# `main`, and a build script can write to the cache scope of `main`. The token of
# `signals` can push, and `build` makes what the site serves. A dump restored from
# a cache also passes its ETag check without its bytes being read, so a forged
# dump would forge the tiers.
#
# Logic lives in scripts/ci/pages_signals.sh and scripts/ci/install_wasm_bindgen.sh.

name: Pages

on:
  push:
    branches: [main]
  # After crates.io writes the day's database dump.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # The only job that can write to the repository. `actions: read` lists the
  # sandbox runs and downloads their artifact. The guard keeps a dispatch from
  # another branch off the history and the live site: `build` and `deploy` skip
  # when this job skips.
  #
  # The `signals` branch has no checkout step. The script tells a missing branch
  # from a network error, which a `continue-on-error` checkout cannot, and pushes
  # with no credential on disk.
  signals:
    name: Record signals
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Check out signal history
        run: bash scripts/ci/pages_signals.sh prepare signal-history
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Score the catalogue
        run: bash scripts/ci/pages_signals.sh tiers signal-history "${RUNNER_TEMP}/tiers.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload the tier report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier-report
          path: ${{ runner.temp }}/tiers.json
          retention-days: 7
          if-no-files-found: error

      - name: Push the snapshot
        run: bash scripts/ci/pages_signals.sh commit signal-history
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────────────────────────────────
  # The `signals` job created the branch, so a missing branch here is an error.
  build:
    name: Build site
    needs: signals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out signal history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: signals
          path: signal-history
          persist-credentials: false

      - name: Download the tier report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tier-report
          path: ${{ runner.temp }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: bash scripts/ci/install_wasm_bindgen.sh

      - name: Build the site
        run: cargo run --locked -p catalogue -- build --report "${RUNNER_TEMP}/tiers.json" --history signal-history --out dist

      - name: Build the search module
        run: bash scripts/ci/build_search_wasm.sh dist/search

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
