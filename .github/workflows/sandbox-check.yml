# Sandbox build check: `cargo check` on current stable for dormant crates.
#
# The result feeds rot signal R6. The pages workflow downloads the latest
# `build-checks` artifact of this workflow and passes it to
# `catalogue tiers --build-checks`.
#
# A crate build runs its build scripts and proc macros: third-party code. So:
#   - the workflow grants no permissions. `list` widens to `contents: read`
#   - no job references a secret
#   - `check` gets no permissions and runs on its own runner
#   - no job restores or saves a cache, because a build script can write to the
#     cache scope of `main`
#   - every checkout sets `persist-credentials: false`
#
# Jobs:
#   list  — reads the newest signal snapshot and the crates.io dump, and writes
#           the crates of each dormant library entry
#   check — runs `cargo check` on each listed release with a per-crate time
#           limit, and uploads the results
#
# The checkout in `check` needs no token permission: the repository is public.
# Logic lives in scripts/ci/sandbox_check.sh.

name: Sandbox check

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: sandbox-check
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  list:
    name: List dormant crates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The orphan `signals` branch holds one snapshot per run date. Until the first
      # snapshot exists the branch is absent, and the list holds only crates
      # that a `finished` statement names.
      - name: Check out signal history
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: signals
          path: signal-history
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Write the crate list
        run: bash scripts/ci/sandbox_check.sh list signal-history "${RUNNER_TEMP}/sandbox-list.jsonl"

      - name: Upload the crate list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-list
          path: ${{ runner.temp }}/sandbox-list.jsonl
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # This job runs third-party build scripts.
  check:
    name: Check dormant crates
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the crate list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sandbox-list
          path: ${{ runner.temp }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Run the checks
        run: bash scripts/ci/sandbox_check.sh check "${RUNNER_TEMP}/sandbox-list.jsonl" "${RUNNER_TEMP}/build-checks.jsonl"

      # A run stopped part way keeps the results written so far.
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-checks
          path: ${{ runner.temp }}/build-checks.jsonl
          retention-days: 90
          if-no-files-found: warn
