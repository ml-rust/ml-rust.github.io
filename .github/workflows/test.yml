# Reusable test workflow.
#
# Called by:
#   - ci.yml (PR checks + manual dispatch)
#
# Not triggered directly — `workflow_call` only.
#
# Every third-party action is pinned to a commit SHA, with its release in a
# trailing comment. A tag can move. A SHA cannot, so a retagged action cannot
# enter a run. Dependabot keeps the pins current (.github/dependabot.yml).
#
# Jobs:
#   lint      — rustfmt, rustdoc with warnings denied, shellcheck on scripts/ci
#               and deploy, and the update script test
#   clippy    — `-D warnings` on every target in the workspace
#   test      — the workspace test suites, run with cargo-nextest
#   msrv      — the MSRV from `[workspace.package]` in Cargo.toml
#   audit     — cargo-deny: advisories, licences, sources, banned crates
#   data      — `catalogue validate` over the committed `data` directory
#   site      — `catalogue build --no-tiers` into `dist`, with no deploy
#   workflows — zizmor static analysis of the workflow files
#
# The workspace has no features, so no job uses a feature matrix.
#
# Every job that builds runs with `--locked`, so a build that needs to change
# Cargo.lock is an error. Until `oxidoc-search` is on crates.io the committed
# lock cannot resolve it, so these jobs fail. The first passing run follows the
# oxidoc release.

name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Format & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: lint

      - name: Check formatting
        run: cargo fmt --all --check

      # shellcheck is preinstalled on ubuntu-latest. The release workflows
      # run these scripts, so a quoting error surfaces here and not at a tag.
      - name: Lint shell scripts
        run: shellcheck scripts/ci/*.sh deploy/*.sh

      - name: Test the update script
        run: bash deploy/test_update.sh

      # Warnings are denied: a link to a private item renders as plain text
      # rather than an error, so the docs lose it with no report.
      - name: Build docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # ─────────────────────────────────────────────────────────────────────────
  # `--all-targets` also checks the tests and examples.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast

  # ─────────────────────────────────────────────────────────────────────────
  # The MSRV comes from `workspace.package.rust-version`, so the published
  # contract and this job cannot drift apart. Both crates inherit it. It is
  # read with grep: the toolchain `cargo metadata` would run on is the one
  # this job is choosing.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV from the workspace manifest
        id: msrv
        run: |
          set -euo pipefail
          MSRV=$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ -z "$MSRV" ]]; then
            echo "::error::rust-version is missing from [workspace.package] in Cargo.toml"
            exit 1
          fi
          echo "Declared MSRV: $MSRV"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: msrv-${{ steps.msrv.outputs.version }}

      - name: Check MSRV
        run: cargo check --workspace --all-targets --locked

  # ─────────────────────────────────────────────────────────────────────────
  # `--exclude-dev`: dev-dependencies link tests only. The second run audits
  # the browser search module on wasm32, the only target it ships for. The
  # `deny.toml` targets are native, so the first run never sees its graph.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --exclude-dev check

      - name: Run cargo-deny on the search module
        run: cargo deny --exclude-dev --manifest-path crates/catalogue-search-wasm/Cargo.toml --target wasm32-unknown-unknown check

  # ─────────────────────────────────────────────────────────────────────────
  # The catalogue data is the site's content. A data file that fails the
  # validator never reaches a build.
  data:
    name: Validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: data

      - name: Validate catalogue data
        run: cargo run --locked -p catalogue -- validate --data data

  # ─────────────────────────────────────────────────────────────────────────
  # Without a report the build needs no network and shows no tier. The pages
  # workflow runs the build with the report.
  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: site

      - name: Build the site
        run: cargo run --locked -p catalogue -- build --no-tiers --out dist

  # ─────────────────────────────────────────────────────────────────────────
  # zizmor reads the workflow files and dependabot.yml. `advanced-security:
  # false` runs it as a plain check that fails the job on a finding. The
  # default uploads SARIF to the Security tab and needs `security-events:
  # write`, which this workflow does not grant. With the default off, the
  # workflow-level `contents: read` is all the action needs.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
