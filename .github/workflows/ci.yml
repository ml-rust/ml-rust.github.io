# CI — thin wrapper that calls the reusable test workflow.
#
# Runs on every ready pull request, on manual dispatch, and when another
# workflow calls it. The guard skips draft pull requests only: on any other
# event `github.event.pull_request` is null, and a bare `draft == false` check
# would skip the suite.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Test Suite
    uses: $/.github/workflows/test.yml
