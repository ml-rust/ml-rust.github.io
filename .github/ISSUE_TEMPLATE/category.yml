name: Category change
description: Change the topics of an entry.
title: "[category] "
labels: ["judgment:category"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to change the topics of an entry.

        Read the [rules](/rules) first. A maintainer listed in `data/maintainers.toml` must approve this issue before it takes effect. Every judgment is public: the issue, your login, the evidence, and the approver appear on the entry page.
  - type: input
    id: entry
    attributes:
      label: Entry slug
      description: The file name of the entry under `data/entries/`, without `.toml`.
      placeholder: example-crate
    validations:
      required: true
  - type: textarea
    id: topics
    attributes:
      label: Topics
      description: The full new list. One topic slug per line. It replaces the current topics.
      placeholder: tensors
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence links
      description: One URL per line. Link public sources only.
      placeholder: https://example.com/proof
    validations:
      required: true
