name: Featured demotion
description: Approve moving a Featured entry to a lower tier.
title: "[demotion] "
labels: ["judgment:demotion"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to approve a demotion that the rules propose. The entry must be Featured now.

        Read the [rules](https://ml-rust.github.io/rules/) first. A maintainer listed in `data/maintainers.toml` must approve this issue before it takes effect. Every judgment is public: the issue, your login, the evidence, and the approver appear on the entry page.
  - type: input
    id: entry
    attributes:
      label: Entry slug
      description: The file name of the entry under `data/entries/`, without `.toml`.
      placeholder: example-crate
    validations:
      required: true
  - type: dropdown
    id: to
    attributes:
      label: Target tier
      description: The tier after the demotion. The current tier is always featured.
      options:
        - listed
        - new
        - archived
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence links
      description: One URL per line. Link public sources only.
      placeholder: https://example.com/proof
    validations:
      required: true
