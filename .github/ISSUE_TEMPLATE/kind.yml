name: Product or demo
description: Set whether an entry is a product or a demo.
title: "[kind] "
labels: ["judgment:kind"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to set whether an entry is a product or a demo.

        Read the [rules](/rules) first. A maintainer listed in `data/maintainers.toml` must approve this issue before it takes effect. Every judgment is public: the issue, your login, the evidence, and the approver appear on the entry page.
  - type: input
    id: entry
    attributes:
      label: Entry slug
      description: The file name of the entry under `data/entries/`, without `.toml`.
      placeholder: example-crate
    validations:
      required: true
  - type: dropdown
    id: value
    attributes:
      label: Kind
      description: A product is built for real use. A demo is built to show a technique.
      options:
        - product
        - demo
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence links
      description: One URL per line. Link public sources only.
      placeholder: https://example.com/proof
    validations:
      required: true
