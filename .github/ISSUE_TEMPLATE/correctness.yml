name: Correctness report
description: Report a wrong fact on an entry.
title: "[correctness] "
labels: ["judgment:correctness"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a fact on an entry page is wrong.

        Read the [rules](https://ml-rust.github.io/rules/) first. A maintainer listed in `data/maintainers.toml` must approve this issue before it takes effect. Every judgment is public: the issue, your login, the evidence, and the approver appear on the entry page.
  - type: input
    id: entry
    attributes:
      label: Entry slug
      description: The file name of the entry under `data/entries/`, without `.toml`.
      placeholder: example-crate
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: State what is wrong and what is correct. The text appears on the entry page.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence links
      description: One URL per line. Link public sources only.
      placeholder: https://example.com/proof
    validations:
      required: true
